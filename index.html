<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jamie Chan</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/favicon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<script>
  // Theme: "auto" picks light during the day and dark at night, by the visitor's local time.
  // Change DAY_START / DAY_END (24-hour clock) to move the switch-over times.
  window.DAY_START = 7; window.DAY_END = 19;
  window.autoTheme = function () { var h = new Date().getHours(); return h >= DAY_START && h < DAY_END ? "light" : "dark"; };
  window.applyTheme = function (mode) { document.documentElement.setAttribute("data-theme", mode === "light" || mode === "dark" ? mode : autoTheme()); };
  (function () { var m = "auto"; try { m = localStorage.getItem("theme") || "auto"; } catch (e) {} applyTheme(m); })();
</script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>

</body>
</html>
